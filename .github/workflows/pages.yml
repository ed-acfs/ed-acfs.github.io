# Pubblica il sito su GitHub Pages tramite Actions, al posto della pipeline
# legacy "Deploy from a branch". Non fa nulla finché in Settings → Pages →
# Build and deployment → Source non viene scelto manualmente "GitHub
# Actions" al posto di "Deploy from a branch": va cambiato a mano quando si
# è pronti, questo file da solo non altera la pubblicazione attuale.
name: Deploy Pages

on:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    # Pubblica automaticamente i post con data futura non appena scatta
    # la data (Jekyll non pubblica post futuri senza un nuovo push/build).
    # Orari pensati per le 6:00 e le 17:00 ora italiana (CEST, UTC+2);
    # in inverno (CET, UTC+1) corrispondono a un'ora dopo, 5:00 e 16:00.
    - cron: '5 4 * * *'
    - cron: '5 15 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
